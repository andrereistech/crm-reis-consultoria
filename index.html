<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reis Consultoria</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--ac:#4f46e5;--ac2:#eef2ff;--ok:#059669;--wa:#16a34a;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b22;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a2f3a;--ac:#818cf8;--ac2:#1e2140;--ok:#34d399;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b22;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a2f3a;--ac:#818cf8;--ac2:#1e2140;--ok:#34d399;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0;display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #c9a24a;flex:none}
.chip{font-size:12px;background:var(--ac2);color:var(--ac);padding:2px 10px;border-radius:99px;margin-left:8px;font-weight:600}
nav{display:flex;gap:4px;padding:10px 20px 0}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--mu);font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac2);color:var(--ac)}
main{padding:16px 20px 40px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;align-items:stretch;overflow-x:auto;padding-bottom:8px}
.col{min-width:0;display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:480px;background:#0b1226;border:1px solid #1b2542;border-radius:12px;color:#e5e7eb}
.ch{padding:12px 14px 10px;border-bottom:1px solid #1b2542}.ct{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.ct i{width:8px;height:8px;border-radius:50%;display:inline-block}.plus{margin-left:auto;background:none;border:0;color:#94a3b8;font-size:20px;line-height:1;cursor:pointer}
.cs{color:#64748b;font-size:11px;margin-top:2px}.cb{padding:10px;overflow-y:auto;flex:1}
.col .card{background:#101a35;border:1px solid #1f2b4d;color:#e5e7eb;box-shadow:none}.col .card.td{border-top:4px solid #3d5290}
.col .mu{color:#8b97b5}.col dt{color:#7c89a8}.col dd{color:#dbe4ff}.col .ok{color:#34d399}.col .prop{background:#18244a;color:#dbe4ff}
.seg{display:flex;gap:4px;margin-bottom:8px}.seg u{flex:1;height:3px;border-radius:2px;background:#26335a}.seg u.on{background:#fbbf24}.seg u.bad{background:#ef4444}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.age{margin-left:auto;font-size:11px;font-weight:700;color:#fbbf24;border:1px solid #6b4e12;background:#2a2108;padding:1px 7px;border-radius:6px}
.chip2{font-size:11px;font-weight:600;color:#aab4d0;border:1px solid #2a3760;background:#17213f;padding:1px 7px;border-radius:6px;margin-bottom:6px}
.nm{font-weight:700;margin:2px 0}.val{color:#34d399;font-weight:700;font-size:14px}
.col .card{padding:8px 10px;margin-bottom:8px;font-size:13px}.sm2{font-size:12px;line-height:1.35}.dts{font-size:11px;color:#6f7ca0;margin-top:4px}
.col .prop{padding:4px 6px;font-size:12px;margin:4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top .val{margin-left:auto;font-size:13px}a.wa.sm{padding:3px 8px;font-size:11px;margin-top:6px}.seg{margin-bottom:6px}
.col.over{border-color:#3b82f6}
.col h3{margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--bd);font-size:13px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
.card{overflow-wrap:anywhere;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.col .card{cursor:pointer}.card[draggable=true]{cursor:grab}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-bottom:6px}
.tag.go21{background:#1d4ed8;color:#fb923c}.tag.fac{background:#16a34a;color:#fff}.tag.td{background:#14295a;color:#f6f1e3}
.card.go21{border-top:4px solid #1d4ed8}.card.fac{border-top:4px solid #16a34a}.card.td{border-top:4px solid #14295a}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok);font-weight:600;font-size:13px}
dl{margin:8px 0;display:grid;gap:2px}dl div{display:flex;justify-content:space-between;gap:8px;font-size:13px}
dt{color:var(--mu)}dd{margin:0;text-align:right}
.prop{background:var(--ac2);border-radius:8px;padding:6px 8px;font-size:13px;margin:6px 0}
a.wa{display:inline-block;margin-top:8px;background:var(--wa);color:#fff;text-decoration:none;font-weight:600;font-size:13px;padding:6px 12px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.kpi b{display:block;font-size:24px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;max-width:720px;margin-bottom:16px}
.bar{display:grid;grid-template-columns:150px 1fr 36px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.bar i{display:block;height:14px;border-radius:7px;background:var(--ac);min-width:4px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-size:12px;text-transform:uppercase}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#m.on{display:flex}
.mb{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.mb h2{margin:0 0 12px;font-size:17px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;flex-wrap:wrap;gap:6px}.chk label{display:flex;align-items:center;gap:6px;font-weight:500;margin:0;border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
.chk input{width:auto}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pk{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;margin:6px 0;cursor:pointer}.pk.on{border-color:var(--ac);background:var(--ac2)}.sm{padding:4px 10px;font-size:12px;margin:8px 4px 0 0}.hide{display:none}.err{color:var(--bad);font-size:13px;margin-top:8px}

#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#login.show{display:flex}.lbox{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:26px;width:100%;max-width:380px;text-align:center}
.lbox h2{margin:10px 0 14px}.lbox .logo{width:96px;height:96px}.lbox form{text-align:left}.lbox .btn{width:100%;margin-top:14px}
.ltabs{display:flex;gap:6px;margin-bottom:6px}.ltabs button{flex:1;padding:8px;border:1px solid var(--bd);background:none;border-radius:10px;color:var(--mu);font:inherit;font-weight:600;cursor:pointer}
.ltabs button.on{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
#out{margin-left:8px}
</style></head><body>

<div id="m"><div class="mb" id="mb"></div></div>
<script>window.claude={use:n=>window.__fbReady.then(()=>window.__fb[n])};window.__fbReady=new Promise(r=>window.__fbResolve=r);</script>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ST=[['novo','Indicado'],['orc','Cotação enviada'],['fech','Pedido fechado'],['pago','Comissão paga'],['perd','Perdido']];
const CO={go21:'21 Go',fac:'Facility',td:'TD Lajes'},OTH={go21:'fac',fac:'go21'};
const PRODS=['Laje pré-moldada','Concreto','Escoras','Malha POP'];
const DEF={whatsapp:'',com:{go21:{t:'fixo',v:50},fac:{t:'fixo',v:50},td:{t:'pct',v:3}}};
let cads={},U,db,admin=false,myId,mine=null,cfg=DEF,sellers={},leads={},stat={},tab='kanban',fsel='',subbed={};

function modal(h){$('#mb').innerHTML=h;$('#m').classList.add('on')}
function closeM(){$('#m').classList.remove('on')}
$('#m').addEventListener('mousedown',e=>{if(e.target.id==='m')closeM()});

(async()=>{
  const user=window.claude&&await claude.use('user');db=window.claude&&await claude.use('db');
  if(!user||!db){$('#app').textContent='Abra pelo link compartilhado e entre com a sua conta.';return}
  U=user;myId=await user.id();admin=await user.canEdit();
  const me=await user.me();
  $('#role').textContent=admin?'Consultor':'Vendedor';if(!admin)tab='novo';
  db.doc('config/settings').onSnapshot(s=>{if(s.exists)cfg={...DEF,...s.data()};render()},()=>{});
  if(admin){
    db.collection('sellers').onSnapshot(s=>{sellers={};s.docs.forEach(d=>{sellers[d.id]=d.data();sub(d.id)});render()},()=>{});
    sub(myId);db.collection('cadastros').onSnapshot(s=>{cads={};s.docs.forEach(d=>cads[d.id]=d.data());render()},()=>{});
  }else{
    sub(myId);
    db.doc('sellers/'+myId).onSnapshot(s=>{
      mine=s.exists?s.data():null;
      if(!mine)profileForm(me.name);
      render()},()=>{});
  }
  render();
})();

function sub(uid){
  if(subbed[uid])return;subbed[uid]=1;
  const load=(map,pre)=>s=>{for(const k in map)if(k.startsWith(uid+'/'))delete map[k];
    s.docs.forEach(d=>map[uid+'/'+d.id]=pre?{...d.data(),id:d.id,uid}:d.data());render()};
  db.collection(`leads/${uid}/items`).onSnapshot(load(leads,1),()=>{});
  db.collection(`status/${uid}/items`).onSnapshot(load(stat,0),()=>{});
}

function profileForm(n){
  modal(`<h2>Complete seu cadastro</h2><form id="pf"><label>Nome</label><input name="n" value="${E(n)}" required>
  <label>Telefone (WhatsApp)</label><input name="t" type="tel" required><div class="row"><button class="btn">Salvar</button></div></form>`);
  $('#pf').onsubmit=async e=>{e.preventDefault();const f=e.target;
    await db.doc('sellers/'+myId).set({name:f.n.value.trim(),tel:f.t.value.trim(),at:Date.now()});closeM()};
}

const sOf=l=>(stat[l.uid+'/'+l.id]||{}).st||'novo';
const vis=()=>Object.values(leads).filter(l=>!fsel||l.uid===fsel).sort((a,b)=>b.at-a.at);
function com(l){if(admin&&l.uid===myId)return 0;
  const s=stat[l.uid+'/'+l.id]||{};if(!['fech','pago'].includes(s.st))return 0;
  const c=(cfg.com?.[l.company]||DEF.com[l.company])||{t:'fixo',v:0};return c.t==='fixo'?+c.v:(+s.valor||0)*(+c.v)/100}
function wa(l){
  const t=['Chegou indicação do Vendedor '+l.seller,'Empresa: '+CO[l.company],'Cliente: '+l.nome,'Telefone: '+l.tel];
  if(l.company!=='td')t.push('Placa: '+l.placa,'Município: '+l.mun,'Usa em aplicativo: '+(l.app?'Sim':'Não'));
  else t.push('Bairro: '+l.bairro,'Produtos: '+(l.prods||[]).join(', '),'Obra: '+l.m2+' m²','Caminhão para a '+l.dist+' m da obra');
  let n=(cfg.whatsapp||'').replace(/\D/g,'');if(n&&n.length<=11)n='55'+n;
  return `https://wa.me/${n}?text=${encodeURIComponent(t.join('\n'))}`}

function render(){
  if(!db)return;
  $('#act').innerHTML=admin?`<select id="fs" onchange="fsel=this.value;render()" style="width:auto"><option value="">Todos os vendedores</option>${Object.entries(sellers).map(([k,v])=>`<option value="${k}" ${k===fsel?'selected':''}>${E(v.name)}</option>`).join('')}</select>`
    :`<button class="btn" onclick="${mine?"tab='novo';render()":'profileForm()'}">${mine?'+ Nova indicação':'Informar código de acesso'}</button>`;
  const tabs=[['novo','Cadastrar cliente']].concat([['kanban','Kanban'],['painel','Painel']]).concat(admin?[['vend','Vendedores'],['cfg','Configurações']]:[]);
  $('#nav').innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
  $('#app').innerHTML={novo,kanban,painel,vend,cfg:cfgv}[tab]();
}

function card(l){

const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const norm=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,'');
function gen(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>a[x%32]).join('');return s.slice(0,4)+'-'+s.slice(4)}

async function dup(k){
  const l=leads[k]||(window._last&&window._last.uid+'/'+window._last.id===k?window._last:null);if(!l)return;
  const to=OTH[l.company],{id,uid,...d}=l,n={...d,company:to,at:Date.now()};

  catch(x){modal('<h2>Não foi possível duplicar</h2><div class="row"><button class="btn" onclick="closeM()">Fechar</button></div>')}

function qLink(k){

function detail(k){

  <dl>${rows.map(r=>`<div><dt>${r[0]}</dt><dd>${E(r[1])}</dd></div>`).join('')}</dl>

  <div style="margin-top:12px"><a class="wa" style="margin:0 4px 6px 0" href="${wa(l)}" target="_blank" rel="noopener">Enviar para o consultor</a>${veh?b('Duplicar para '+CO[OTH[l.company]],"closeM();dup(this.dataset.k)"):''}${admin?b('Status e cotação',"editForm(this.dataset.k)",1):''}${can?b('Editar dados',"closeM();leadForm(this.dataset.k)",1)+b('Excluir',"lDel(this.dataset.k)",1):''}${b('Fechar','closeM()',1)}</div>`);
}
const CL={novo:'#9ca3af',orc:'#3b82f6',fech:'#f59e0b',pago:'#10b981',perd:'#ef4444'},LV={novo:1,orc:2,fech:3,pago:4,perd:1};
function card(l){
  const k=l.uid+'/'+l.id,s=stat[k]||{},sn=s.st||'novo',veh=l.company!=='td',c=com(l),can=admin||sn==='novo';
  const ms=Date.now()-(l.at||Date.now()),age=ms<864e5?Math.max(1,Math.round(ms/36e5))+'h':Math.floor(ms/864e5)+'d';
  const rows=veh?[['Placa',l.placa],['Município',l.mun]]:[['Bairro',l.bairro],['Produtos',(l.prods||[]).join(', ')],['Obra',l.m2+' m²'],['Caminhão para a',l.dist+' m']];

  <div class="top"><span class="tag ${l.company}">${CO[l.company]}</span>${veh&&l.app?'<span class="chip2">Aplicativo</span>':''}<span class="age">${age}</span></div>
  <div class="nm">${E(l.nome)}</div>${s.valor?`<div class="val">${R(s.valor)}</div>`:''}
  <div class="mu">${E(l.tel)}</div>${admin?`<span class="chip2" style="display:inline-block;margin-top:6px">${E(l.seller)}</span>`:''}
  <dl>${rows.map(r=>`<div><dt>${r[0]}</dt><dd>${E(r[1])}</dd></div>`).join('')}</dl>
  ${s.prop?`<div class="prop"><b>Cotação do consultor</b><br>${E(s.prop)}</div>`:''}${c?`<div class="ok">Comissão: ${R(c)}</div>`:''}
  <a class="wa" href="${wa(l)}" target="_blank" rel="noopener">Enviar para o consultor</a>${veh?`<button class="btn g sm" data-k="${E(k)}" onclick="dup(this.dataset.k)">Duplicar para ${CO[OTH[l.company]]}</button>`:''}${can?`<div><button class="btn g sm" data-k="${E(k)}" onclick="leadForm(this.dataset.k)">Editar dados</button><button class="btn g sm" data-k="${E(k)}" onclick="lDel(this.dataset.k)">Excluir</button></div>`:''}</div>`}
function kanban(){
  const L=vis();
  if(!L.length&&!admin)return '<p class="mu">Nenhuma indicação ainda. Use a aba “Cadastrar cliente” para começar.</p>';
  return `${admin?'':'<p class="mu" style="margin-top:0">Aqui você acompanha suas indicações. O consultor atualiza o status e envia a cotação para você.</p>'}<div class="board">${ST.map(([id,nm])=>{const x=L.filter(l=>sOf(l)===id);
    return `<div class="col" data-st="${id}"><div class="ch"><div class="ct"><i style="background:${CL[id]}"></i>${nm}${id==='novo'?`<button class="plus" title="Nova indicação" onclick="tab='novo';render()">+</button>`:''}</div><div class="cs">${x.length} ${x.length===1?'indicação':'indicações'}</div></div><div class="cb">${x.map(card).join('')}</div></div>`}).join('')}</div>`}
const fd=t=>t?new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'';
function card(l){
  const k=l.uid+'/'+l.id,s=stat[k]||{},sn=s.st||'novo',veh=l.company!=='td',c=com(l);
  const info=veh?[l.placa,l.mun]:[l.bairro,(l.prods||[]).join(', '),l.m2+' m²',l.dist+' m'];
  return `<div class="card ${l.company}" ${admin?'draggable="true"':''} data-k="${E(k)}">
  <div class="seg">${[1,2,3,4].map(i=>`<u class="${i<=LV[sn]?(sn==='perd'?'bad':'on'):''}"></u>`).join('')}</div>
  <div class="top"><span class="tag ${l.company}">${CO[l.company]}</span>${veh&&l.app?'<span class="chip2">App</span>':''}${s.valor?`<span class="val">${R(s.valor)}</span>`:''}</div>
  <div class="nm">${E(l.nome)}</div>
  <div class="mu sm2">${E(l.tel)} · ${info.map(E).join(' · ')}</div>
  ${admin?`<div class="mu sm2">Vendedor: ${E(l.seller)}</div>`:''}
  ${s.prop?`<div class="prop">${E(s.prop)}</div>`:''}${c?`<div class="ok sm2">Comissão: ${R(c)}</div>`:''}
  <div class="dts">Criado ${fd(l.at)}${s.mov?' · Movido '+fd(s.mov):''}</div>
  ${admin?'':`<a class="wa sm" href="${wa(l)}" target="_blank" rel="noopener">Enviar para o consultor</a>`}</div>`}
const mkTel=v=>{const d=v.replace(/\D/g,'').slice(0,11);return d.length<3?(d?'('+d:''):d.length<7?`(${d.slice(0,2)}) ${d.slice(2)}`:d.length<11?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`};
document.addEventListener('input',e=>{if(e.target.type==='tel')e.target.value=mkTel(e.target.value)});
document.addEventListener('focusin',e=>{if(e.target.type==='tel'&&!e.target.placeholder)e.target.placeholder='(00) 00000-0000'});
function profileForm(){modal(`<h2>Acesso não ativo</h2><p class="mu">Seu cadastro não foi encontrado. Fale com o consultor.</p><div class="row"><button class="btn" onclick="document.getElementById('out').click()">Sair</button></div>`)}
function sForm(sid){
  const v=sid?cads[sid]:{};
  modal(`<h2>${sid?'Editar':'Cadastrar'} vendedor</h2><form id="sf"><label>Nome</label><input name="n" value="${E(v.nome||'')}" required>
  <label>Sobrenome</label><input name="s" value="${E(v.sobrenome||'')}" required>
  <label>Telefone (WhatsApp) ${sid?'<span class="mu">— não pode ser alterado</span>':''}</label><input name="t" type="tel" value="${E(v.tel||'')}" required>
  <label>Bairro</label><input name="b" value="${E(v.bairro||'')}" required><div class="err" id="er"></div>
  <div class="row"><button type="button" class="btn g" onclick="closeM()">Cancelar</button><button class="btn">Salvar</button></div></form>`);
  if(sid)$('#sf').t.readOnly=true;
  $('#sf').onsubmit=async e=>{e.preventDefault();const f=e.target;
    const d={nome:f.n.value.trim(),sobrenome:f.s.value.trim(),tel:f.t.value.trim(),bairro:f.b.value.trim()},nm=d.nome+' '+d.sobrenome;
    try{if(sid){await db.doc('cadastros/'+sid).update(d);await db.doc('sellers/'+sid).update({name:nm});closeM()}
      else{const code=gen(),uid=await FB.create(d.tel,code);
        await db.doc('cadastros/'+uid).set({...d,code,at:Date.now()});
        await db.doc('sellers/'+uid).set({sid:uid,name:nm,tel:d.tel,at:Date.now()});
        cads[uid]={...d,code};invite(uid)}}
    catch(x){$('#er').textContent=x&&x.code==='auth/email-already-in-use'?'Já existe um vendedor com esse telefone.':'Não foi possível salvar.'}};
}
function invite(sid){
  const c=cads[sid],msg=`Olá, ${c.nome}! Seu acesso à plataforma da Reis Consultoria:\nLink: ${LINK}\nTelefone: ${c.tel}\nCódigo de acesso: ${c.code}`;
  let n=(c.tel||'').replace(/\D/g,'');if(n.length<=11)n='55'+n;
  modal(`<h2>Convite para ${E(c.nome)}</h2><textarea rows="5" readonly id="im">${E(msg)}</textarea>
  <p class="mu">O vendedor entra com o telefone e o código <b>${E(c.code)}</b>.</p>
  <div class="row"><button class="btn g" onclick="closeM()">Fechar</button><button class="btn g" id="cp">Copiar</button><a class="btn" style="background:var(--wa);text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${encodeURIComponent(msg)}">Enviar no WhatsApp</a></div>`);
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(msg);$('#cp').textContent='Copiado ✓'}catch(x){$('#im').select()}};
}
function newCode(sid){
  conf('Gerar novo código?','O código antigo deixa de funcionar. Envie o novo código ao vendedor.',async()=>{
    const c=cads[sid],code=gen();await FB.changePass(c.tel,c.code,code);
    await db.doc('cadastros/'+sid).update({code});cads[sid].code=code;invite(sid)});
}
function sDel(sid){
  const c=cads[sid];
  conf('Remover '+E(c.nome)+'?','O acesso dele é encerrado. As indicações já feitas continuam salvas.',async()=>{
    try{await FB.remove(c.tel,c.code)}catch(x){}
    await db.doc('sellers/'+sid).delete();await db.doc('cadastros/'+sid).delete();delete cads[sid];delete sellers[sid];render()});
}
let drag=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(c)drag=c.dataset.k});
document.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(c&&drag){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('.col');if(c)c.classList.remove('over')});
document.addEventListener('drop',async e=>{
  const c=e.target.closest('.col');if(!c||!drag||!admin)return;e.preventDefault();c.classList.remove('over');
  const k=drag,st=c.dataset.st;drag=null;
  if(st==='fech'&&!(stat[k]||{}).valor)return editForm(k,st);
  const l=leads[k];await db.doc(`status/${l.uid}/items/${l.id}`).set({...(stat[k]||{}),st,upd:Date.now(),mov:st!==sOf(l)?Date.now():((stat[k]||{}).mov||null)})});
document.addEventListener('click',e=>{
  if(e.target.closest('a,button'))return;const c=e.target.closest('.card');if(c)detail(c.dataset.k)});
</script>
<script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword,updatePassword,deleteUser} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,getDoc,setDoc,updateDoc,deleteDoc,addDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app);
const q=s=>document.querySelector(s);
const mail=t=>t.replace(/\D/g,'')+'@vendedor.reisconsultoria.app';
const pw=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,'');
const wrap=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
const dbShim={
  doc:p=>{const r=doc(fs,...p.split('/'));return{get:async()=>wrap(await getDoc(r)),set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r),onSnapshot:(cb,er)=>onSnapshot(r,s=>cb(wrap(s)),er)}},
  collection:p=>{const r=collection(fs,...p.split('/'));return{add:async d=>({id:(await addDoc(r,d)).id}),onSnapshot:(cb,er)=>onSnapshot(r,s=>cb({docs:s.docs.map(wrap)}),er)}}
};
const sec=()=>getAuth(getApps().find(x=>x.name==='sec')||initializeApp(firebaseConfig,'sec'));
window.FB={
  async create(tel,code){const a=sec(),c=await createUserWithEmailAndPassword(a,mail(tel),pw(code));await signOut(a);return c.user.uid},
  async changePass(tel,old,nw){const a=sec(),c=await signInWithEmailAndPassword(a,mail(tel),pw(old));await updatePassword(c.user,pw(nw));await signOut(a)},
  async remove(tel,code){const a=sec(),c=await signInWithEmailAndPassword(a,mail(tel),pw(code));await deleteUser(c.user)}
};
const tabs=v=>{q('#tv').classList.toggle('on',v);q('#tc').classList.toggle('on',!v);q('#fv').classList.toggle('hide',!v);q('#fc').classList.toggle('hide',v);q('#le').textContent=''};
q('#tv').onclick=()=>tabs(true);q('#tc').onclick=()=>tabs(false);
const fail=e=>{q('#le').textContent=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(e.code)?'Dados incorretos. Confira e tente novamente.':'Não foi possível entrar. Tente de novo.'};
q('#fv').onsubmit=async e=>{e.preventDefault();const f=e.target;try{await signInWithEmailAndPassword(auth,mail(f.t.value),pw(f.c.value))}catch(x){fail(x)}};
q('#fc').onsubmit=async e=>{e.preventDefault();const f=e.target;try{await signInWithEmailAndPassword(auth,f.e.value.trim(),f.p.value)}catch(x){fail(x)}};
onAuthStateChanged(auth,async u=>{
  if(!u){q('#login').classList.add('show');return}
  let adm=false;try{adm=(await getDoc(doc(fs,'admins',u.uid))).exists()}catch(x){}
  window.__fb={user:{id:()=>u.uid,canEdit:()=>adm,me:async()=>({name:''})},db:dbShim};
  q('#login').classList.remove('show');
  if(!q('#out')){const b=document.createElement('button');b.id='out';b.className='btn g';b.textContent='Sair';b.onclick=async()=>{await signOut(auth);location.reload()};q('header').appendChild(b)}
  window.__fbResolve();
});
</script>
